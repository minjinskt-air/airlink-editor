<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>air링크 에디터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* air 디자인 가이드 — 흰 바탕, 얇은 회색 보더 카드, 블랙 CTA, 블루 액센트 */
  --ink:#111417;--black:#0B0F10;--ink60:#5B6066;--ink40:#8B9096;--ink20:#C9CDD2;
  --line:#E6E8EB;--line2:#F1F2F4;--base:#F1F2F5;--white:#fff;
  --blue:#2C64F6;--blue-soft:#EEF3FF;--blue-ink:#1D4ED8;
  --cobalt:var(--blue);--cobalt-soft:var(--blue-soft);--signal:#FFC400;
  --alert:#E5484D;--ok:#2C64F6;--call:#2BB24C;
  --r:10px;--rc:12px;--rl:16px;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:#EEF0F3;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;gap:26px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit;width:100%}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- air 워드마크 ---------- */
.logo{display:block;height:24px;width:auto;flex:0 0 auto}

/* ---------- 사이드 라벨 ---------- */
#aside{width:208px;flex:0 0 208px;display:none}
@media(min-width:900px) and (min-height:860px){#aside{display:block}}
#aside h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
#aside .kick{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:6px}
#aside p{font-size:12.5px;line-height:1.65;color:var(--ink60);margin-top:10px}
#aside p b{color:var(--ink)}
#aside .steps{margin-top:20px;border-top:1px solid #D9DCE1;padding-top:14px}
#aside .st{display:flex;gap:9px;padding:7px 0;font-size:12.5px;color:var(--ink40);align-items:center}
#aside .st i{
  width:18px;height:18px;border-radius:50%;background:#D9DDE3;color:#fff;flex:0 0 18px;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-style:normal;
}
#aside .st.on{color:var(--ink);font-weight:700}
#aside .st.on i{background:var(--blue)}
#aside .st.done i{background:var(--black)}
#aside .hint{margin-top:18px;font-size:11.5px;line-height:1.6;color:var(--ink40);border-top:1px solid #D9DCE1;padding-top:14px;background:none;border-radius:0;padding-left:0;padding-right:0}
#aside .hint b{color:var(--ink60)}
#aside .io{margin-top:8px;font-size:12px;font-weight:600;color:var(--ink);height:40px;border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%}
#aside .io:hover{border-color:var(--ink40)}
#aside .wipe{margin-top:14px;font-size:12px;font-weight:600;color:var(--alert);height:40px;border:1px solid #F0D2D3;border-radius:var(--r);background:#fff;width:100%}

/* ---------- device shell ---------- */
#device{
  width:390px;height:100%;max-height:844px;background:var(--white);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:460px) and (min-height:880px){
  #device{border-radius:42px;box-shadow:0 24px 70px rgba(16,20,30,.16);height:844px}
}
@media(max-width:459px){ body{background:#fff} }

.statusbar{
  height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:12px;font-weight:600;color:var(--ink40);
}
.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:0 20px}
.pb{padding-bottom:24px}

/* 상단 내비: 꺾쇠 + 좌측 정렬 타이틀 */
.nav{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:4px;padding:0 10px}
.nav .bk{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;color:var(--black)}
.nav .t{flex:1;font-size:15px;font-weight:700;letter-spacing:-.02em}
.nav .r{font-size:14px;font-weight:600;color:var(--ink60);padding:8px 10px}
/* 단계 진행바 */
.prog{display:flex;gap:3px;padding:4px 20px 0;flex:0 0 auto}
.prog i{flex:1;height:4px;border-radius:2px;background:#EEF0F3}
.prog i.on{background:var(--blue)}

h1.head{font-size:22px;font-weight:700;line-height:1.42;letter-spacing:-.035em;margin-top:26px}
p.sub{font-size:14px;line-height:1.6;color:var(--ink60);margin-top:8px}
.label{font-size:13px;font-weight:600;color:var(--ink60);margin:24px 0 10px}
.note{font-size:12px;line-height:1.6;color:var(--ink40);text-align:center;padding-top:12px}

.btn{
  width:100%;height:56px;border-radius:var(--r);background:var(--black);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:-.02em;transition:opacity .12s,transform .08s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#E9EBEE;color:#B4B9BF;cursor:default;transform:none}
.btn.blue{background:var(--blue)}
.btn.sec{background:var(--base);color:var(--ink)}
.btn.ghost{background:none;color:var(--ink60);height:46px;font-weight:500;font-size:14px}
.foot{flex:0 0 auto;padding:12px 20px 24px;background:var(--white)}

/* 선택 카드 (통신사 선택형) */
.opt{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 20px;border:1px solid var(--line);border-radius:var(--rc);margin-bottom:10px;font-size:15px;font-weight:500;width:100%;text-align:left;background:#fff;transition:border-color .12s}
.opt .ck{margin-left:auto;color:var(--ink20);display:flex}
.opt[aria-pressed="true"]{border:1.5px solid var(--black);padding:0 19.5px}
.opt[aria-pressed="true"] .ck{color:var(--black)}

/* 안내 카드 (가입 신청 내역형) */
.card{border:1px solid var(--line);border-radius:var(--rc);padding:26px 22px 22px;text-align:center;margin-top:14px;background:#fff}
.card p{font-size:15px;line-height:1.6;font-weight:500;color:var(--ink)}
.card p.cap{font-size:13px;color:var(--ink40);font-weight:500;margin-top:4px}
.card .btn{margin-top:22px;height:52px;font-size:15px}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:54px;border-radius:var(--r);background:#F6F7F9;font-size:22px;font-weight:600;transition:background .1s,transform .08s}
.key:active{background:var(--blue-soft);transform:scale(.96)}
.key.aux{font-size:14px;font-weight:600;color:var(--ink60);background:transparent}
.key.aux:active{background:var(--line2)}

.display{display:flex;align-items:center;justify-content:center;gap:4px;font-size:42px;font-weight:800;letter-spacing:-.02em;padding:22px 0 8px}
.display .d{width:34px;text-align:center}
.display .d.off{color:var(--line)}
.display .st{color:var(--blue);margin-left:8px}
.state{text-align:center;font-size:13.5px;font-weight:600;height:22px;transition:color .15s}
.state.idle{color:var(--ink40);font-weight:500}
.state.ok{color:var(--blue)}
.state.no{color:var(--alert)}

.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.chip{font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink60)}
.chip:active{border-color:var(--black)}
.chip b{font-weight:700;color:var(--ink)}

.field{margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink60);margin-bottom:8px}
.inp{min-height:52px;border:1px solid var(--line);border-radius:var(--rc);padding:14px 16px;font-size:15px;display:flex;align-items:center}
.inp:focus-within{border:1.5px solid var(--black);padding:13.5px 15.5px}
.inp input::placeholder,.inp textarea::placeholder{color:var(--ink20)}
textarea{resize:none;line-height:1.5}

.avatar-pick{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 0 18px}
.avatar{
  width:84px;height:84px;border-radius:50%;background:#F6F7F9;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:28px;font-weight:700;color:var(--ink60);border:1px solid var(--line);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-pick span{font-size:13px;font-weight:600;color:var(--blue)}

.lrow{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--rc);margin-bottom:8px;background:var(--white)}
.lrow .grip{color:var(--ink20);font-size:15px;letter-spacing:-3px;flex:0 0 12px}
.ico{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.ico svg{width:17px;height:17px}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tx span{display:block;font-size:12px;color:var(--ink40);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .more{color:var(--ink40);font-size:17px;padding:4px 2px;flex:0 0 auto}
.addrow{height:54px;border-radius:var(--rc);background:#F6F7F9;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;color:var(--ink);width:100%}
.hint{padding:13px 16px;background:#F6F7F9;border-radius:var(--rc);font-size:12.5px;line-height:1.6;color:var(--ink60);margin-top:10px}
.hint b{color:var(--ink)}

/* 테마 선택 */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 18px}
.tgrid .opt{margin:0;min-height:56px;padding:0 14px;gap:10px}
.tgrid .opt[aria-pressed="true"]{padding:0 13.5px}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:0 0 22px}
.dot.paper{background:#fff}.dot.ink{background:#14161A}.dot.cobalt{background:#2C64F6}.dot.signal{background:#FFCC00}
.preview{border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;height:300px}

/* ---------- 인트로 ---------- */
.introwrap{padding:12px 20px 22px;background:#fff;min-height:100%;display:flex;flex-direction:column}
.introwrap>*{flex:0 0 auto}
.brandtop{display:flex;align-items:flex-end;gap:5px}
.brandtop .bt{font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1;padding-bottom:1px}
h1.hero{font-size:26px;font-weight:800;line-height:1.36;letter-spacing:-.045em;margin-top:20px}
h1.hero b{color:var(--blue);font-weight:800}
p.herosub{font-size:14px;line-height:1.6;color:var(--ink60);margin-top:10px}

.duo{display:flex;align-items:center;gap:0;margin-top:22px;flex:1 1 auto;min-height:0}
.duo .arw{flex:0 0 24px;text-align:center;font-size:16px;font-weight:800;color:var(--ink20);letter-spacing:-3px}
.mini{
  flex:1;min-width:0;background:#fff;border-radius:14px;border:1px solid var(--line);
  overflow:hidden;height:405px;max-height:100%;display:flex;flex-direction:column;
}
.mini .mbar{height:15px;flex:0 0 15px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:6.5px;font-weight:700;color:var(--ink20)}
.mini .mbody{flex:1;min-height:0;padding:6px 10px 10px;display:flex;flex-direction:column}
.mini .mbody>*{flex:0 0 auto}
.mkeys span,.mrow{flex:0 0 auto}

.mnum{text-align:center;font-size:27px;font-weight:700;letter-spacing:.02em;margin-top:12px}
.mnum span{color:var(--blue)}
.mcap{text-align:center;font-size:8.5px;color:var(--ink40);margin-top:3px}
.mkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;padding:0 6px}
.mkeys span{
  height:33px;border-radius:50%;background:#F3F4F6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink);line-height:1;
}
.mkeys span em{font-style:normal;font-size:5px;font-weight:700;color:var(--ink20);margin-top:1px;letter-spacing:.04em}
.mcall{display:flex;justify-content:center;margin-top:auto;padding-top:8px}
.mcall i{width:34px;height:34px;border-radius:50%;background:var(--call);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal}

.mhead{display:flex;align-items:flex-end;justify-content:center;gap:2px;font-size:7.5px;font-weight:700;letter-spacing:-.02em;color:var(--black);line-height:1}
.mhead .logo{height:8px}
.mav{width:46px;height:46px;border-radius:50%;margin:8px auto 6px;background:linear-gradient(140deg,#C9D6FB,#9DB5F8);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff}
.mname{text-align:center;font-size:11px;font-weight:700;letter-spacing:-.02em}
.mnum2{text-align:center;font-size:9.5px;font-weight:700;color:var(--ink60);margin-top:1px}
.mnum2 span{color:var(--blue)}
.mbio{text-align:center;font-size:7px;color:var(--ink40);margin-top:3px}
.mrows{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 7px}
.mrow .mi{width:18px;height:18px;border-radius:6px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#fff;padding:0;border:none;font-size:7px}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:8px;font-weight:700;letter-spacing:-.01em}
.mrow .mt em{display:block;font-style:normal;font-size:6.5px;color:var(--ink40);margin-top:.5px}
.mrow .mg{font-size:8px;color:var(--ink20)}

/* ---------- 공개 페이지(미리보기) ---------- */
.page{min-height:100%;display:flex;flex-direction:column;padding:34px 22px 20px;background:var(--pg-bg);color:var(--pg-fg)}
.page[data-theme=paper]{--pg-bg:#fff;--pg-fg:#111417;--pg-btn:#fff;--pg-bd:#E6E8EB;--pg-mute:#8B9096;--pg-acc:#2C64F6}
.page[data-theme=ink]{--pg-bg:#111417;--pg-fg:#fff;--pg-btn:#1C1F24;--pg-bd:#30343B;--pg-mute:#959BA4;--pg-acc:#FFCC00}
.page[data-theme=cobalt]{--pg-bg:#2C64F6;--pg-fg:#fff;--pg-btn:rgba(255,255,255,.14);--pg-bd:rgba(255,255,255,.3);--pg-mute:rgba(255,255,255,.75);--pg-acc:#FFCC00}
.page[data-theme=signal]{--pg-bg:#FFCC00;--pg-fg:#111417;--pg-btn:rgba(255,255,255,.55);--pg-bd:rgba(17,20,23,.14);--pg-mute:rgba(17,20,23,.6);--pg-acc:#2C64F6}
.pg-num{text-align:center;font-size:15px;font-weight:800;letter-spacing:.04em}
.pg-num em{font-style:normal;color:var(--pg-acc)}
.pg-av{width:90px;height:90px;border-radius:50%;margin:20px auto 14px;overflow:hidden;background:var(--pg-btn);border:1px solid var(--pg-bd);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.pg-av img{width:100%;height:100%;object-fit:cover}
.pg-name{text-align:center;font-size:20px;font-weight:700;letter-spacing:-.03em}
.pg-bio{text-align:center;font-size:13.5px;line-height:1.6;color:var(--pg-mute);margin-top:7px;white-space:pre-line}
.pg-links{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.pg-link{min-height:58px;border-radius:var(--rc);background:var(--pg-btn);border:1px solid var(--pg-bd);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:14.5px;font-weight:600;color:var(--pg-fg);text-align:left;width:100%;text-decoration:none}
.pg-link .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-foot{margin-top:auto;padding-top:26px;text-align:center}
.pg-cta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--pg-fg);border:1px solid var(--pg-bd);border-radius:99px;padding:10px 16px}
.pg-rep{font-size:11px;color:var(--pg-mute);margin-top:11px}

.numcard{border:1px solid var(--line);border-radius:var(--rc);padding:26px 18px;text-align:center;margin-top:22px}
.numcard .n{font-size:36px;font-weight:800;letter-spacing:-.04em}
.numcard .n em{font-style:normal;color:var(--blue)}
.numcard .c{font-size:13px;color:var(--ink40);margin-top:6px}
.ch{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--rc);margin-bottom:8px;width:100%;text-align:left;background:#fff}
.ch .cb{width:38px;height:38px;border-radius:10px;background:#F6F7F9;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 38px}
.ch .cx{flex:1;min-width:0}
.ch .cx b{display:block;font-size:14.5px;font-weight:600}
.ch .cx span{display:block;font-size:12px;color:var(--ink40);margin-top:2px}
.ch .act{font-size:13px;font-weight:600;color:var(--blue);flex:0 0 auto}
#qrbox{display:flex;justify-content:center;padding:14px 0 6px}
#qrbox>div{padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;line-height:0}

/* ---------- 관리 홈 (가입 신청 내역형 헤더) ---------- */
.ahead{padding-top:8px}
.ahead .trow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
h1.ptitle{font-size:28px;font-weight:800;letter-spacing:-.045em;line-height:1.25}
.lnk{display:flex;align-items:center;gap:2px;font-size:13.5px;font-weight:600;color:var(--ink);padding:4px 0}
.bignum{font-size:34px;font-weight:800;letter-spacing:-.04em}
.bignum em{font-style:normal;color:var(--blue)}

.sum{display:flex;gap:8px;margin-top:10px}
.sumbox{flex:1;border:1px solid var(--line);border-radius:var(--rc);padding:16px}
.sumbox span{font-size:12.5px;font-weight:500;color:var(--ink40)}
.sumbox b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.toggle{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--rc);padding:16px;margin-top:10px}
.toggle .tt{flex:1}
.toggle .tt b{display:block;font-size:14.5px;font-weight:600}
.toggle .tt span{display:block;font-size:12px;color:var(--ink40);margin-top:3px;line-height:1.45}
.track{width:48px;height:29px;border-radius:99px;background:#E2E4E8;position:relative;flex:0 0 48px;transition:background .16s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.track[aria-pressed=true]{background:var(--blue)}
.track[aria-pressed=true]::after{transform:translateX(19px)}
.track:disabled{opacity:.45}
.menu{margin-top:14px;border:1px solid var(--line);border-radius:var(--rc);padding:0 16px}
.mi{display:flex;align-items:center;padding:17px 0;border-bottom:1px solid var(--line2);font-size:15px;font-weight:500;width:100%;text-align:left}
.menu .mi:last-child{border-bottom:none}
.mi .ar{margin-left:auto;color:var(--ink20);display:flex;align-items:center}
.mi.danger{color:var(--alert)}

.tabs{display:flex;gap:7px;margin:14px 0 6px}
.tab{font-size:13px;font-weight:600;padding:9px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink60)}
.tab[aria-pressed=true]{background:var(--black);border-color:var(--black);color:#fff}
.bars{display:flex;align-items:flex-end;gap:7px;height:116px}
.bars div{flex:1;background:var(--blue-soft);border-radius:5px 5px 0 0;min-height:3px}
.bars div.mx{background:var(--blue)}
.axis{display:flex;gap:7px;margin-top:7px}
.axis span{flex:1;text-align:center;font-size:11px;color:var(--ink40)}

function fmt(n){ if(!n) return ''; return n.length>4 ? n.slice(0,4)+'-'+n.slice(4) : n; }
function shortlink(n){return 'num.kr/'+n}
function platform(url){for(var i=0;i<PLATFORMS.length;i++){if(PLATFORMS[i].m.test(url))return PLATFORMS[i]}return null}
function titleFrom(url){
  var p=platform(url); if(p)return p.n;
  try{return new URL(url).hostname.replace(/^www\./,'')}catch(e){return '내 링크'}
}
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on')},1700);
}
function available(n){
  if(BLOCKED.indexOf(n)>=0) return 'blocked';
  if(S.pages[n]) return 'taken';

}
function iconMarkup(p,size){
  var bg=p?p.c:'var(--ink40)', fg=(p&&p.fg)?p.fg:'#fff', t=p?p.t:'';

function copy(t){

function importDemo(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!d.pages) throw new Error('bad');
      localStorage.setItem(KEY,JSON.stringify(d));
      location.reload();
    }catch(e){ toast('불러올 수 없는 파일이에요'); }
  };
  r.readAsText(file);
}

/* ---------- router ---------- */
var route='intro',param=null,stack=[];
function go(r,p,push){
  if(push!==false&&route) stack.push([route,param]);
  route=r; param=p||null; render(); $('#view').scrollTop=0;
}
function back(){
  var s=stack.pop();
  if(s){route=s[0];param=s[1];render()} else go('intro',null,false);
}

/* ---------- shells ---------- */
function shell(navHtml,body,foot){
  return navHtml+'<div class="scroll"><div class="pad pb">'+body+'</div></div>'+(foot?'<div class="foot">'+foot+'</div>':'');
}
function nav(title,opt){
  opt=opt||{};
  var h='<div class="nav">'+
    (opt.noback?'<span class="bk"></span>':'<button class="bk" data-a="back" aria-label="뒤로">'+CHEV+'</button>')+
    '<span class="t">'+esc(title||'')+'</span>'+
    (opt.right?'<button class="r" data-a="'+opt.rightA+'">'+opt.right+'</button>':'')+'</div>';
  if(opt.step) h+=prog(opt.step);
  return h;
}
/* 4단계 진행바: 넘버 → 프로필·링크 → 테마 → 발행 */
function prog(n){
  var s='<div class="prog">';
  for(var i=1;i<=4;i++) s+='<i class="'+(i<=n?'on':'')+'"></i>';
  return s+'</div>';
}

function recommend(){
  var GROUPS=[
    ['반복수',['7979','2424','3636','5858','9292']],
    ['패턴',['9630','2580','1470','3690','1379']],
    ['의미',['1004','8282','5959','1212','2424']],
    ['연속수',['1234','6789','4321','9876']]
  ];
  var out=[];
  // 서로 다른 성격으로 하나씩
  for(var g=0;g<GROUPS.length&&out.length<3;g++){
    var lab=GROUPS[g][0], arr=GROUPS[g][1];
    for(var i=0;i<arr.length;i++){
      if(available(arr[i])==='ok'&&!out.some(function(o){return o.v===arr[i]})){
        out.push({l:lab,v:arr[i]}); break;
      }
    }
  }
  var n=1000;
  while(out.length<3&&n<9999){
    if(available(String(n))==='ok') out.push({l:'추천',v:String(n)});
    n+=317;
  }
  return out;
}

  var m=sheet('<h3>'+(ed?'링크 수정':'링크 추가')+'</h3><p class="d">URL을 붙여넣으면 이름을 채워드려요</p>'+

    '<div class="row">'+(ed?'<button class="btn sec" data-x="del">삭제</button>':'')+'<button class="btn" data-x="ok">저장</button></div>');
  var lu=m.querySelector('#lu'),lt=m.querySelector('#lt');

  });

    var x=e.target.dataset.x; if(!x) return;

    var url=lu.value.trim(); if(!url){m.remove();return}

function shareCard(){
  var p=me(); if(!p) return;
  var W=1080,H=1920,c=document.createElement('canvas');
  c.width=W;c.height=H;var g=c.getContext('2d');
  var TH={paper:['#FFFFFF','#111417','#2C64F6'],ink:['#111417','#FFFFFF','#FFCC00'],
          cobalt:['#2C64F6','#FFFFFF','#FFCC00'],signal:['#FFCC00','#111417','#2C64F6']}[p.theme];
  g.fillStyle=TH[0];g.fillRect(0,0,W,H);
  g.textAlign='center';
  g.fillStyle=TH[1];g.font='700 44px Pretendard,sans-serif';
  g.globalAlpha=.6;g.fillText('나의 air링크',W/2,620);g.globalAlpha=1;
  g.font='800 150px Pretendard,sans-serif';
  var t=fmt(p.num), tw=g.measureText(t).width, sw=g.measureText(' *').width;
  g.textAlign='left';
  g.fillText(t,(W-tw-sw)/2,800);
  g.fillStyle=TH[2];g.fillText(' *',(W-tw-sw)/2+tw,800);
  g.textAlign='center';g.fillStyle=TH[1];
  g.font='700 56px Pretendard,sans-serif';
  g.fillText(p.nick,W/2,920);
  g.globalAlpha=.55;g.font='500 38px Pretendard,sans-serif';
  g.fillText(shortlink(p.num),W/2,1000);
  g.font='500 34px Pretendard,sans-serif';
  g.fillText('전화 다이얼에 '+p.num+'* 누르고 통화',W/2,1760);
  g.globalAlpha=1;
  c.toBlob(function(b){
    var u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='airlink_'+p.num+'.png';a.click();
    setTimeout(function(){URL.revokeObjectURL(u)},2000);
    toast('공유 카드를 저장했어요');
  });
}

/* ============================================================
   이벤트
   ============================================================ */
$('#view').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var a=b.dataset.a,v=b.dataset.v;

  if(a==='back') return back();
  if(a==='home'){ stack=[]; return go(S.me?'home':'intro',null,false); }

  if(a==='pick'){ pickVal=''; return go('pick'); }
  if(a==='k'){ if(pickVal.length<4){pickVal+=v;render()} return; }
  if(a==='del'){ pickVal=pickVal.slice(0,-1); return render(); }
  if(a==='clr'){ pickVal=''; return render(); }
  if(a==='fill'){ pickVal=v; return render(); }
  if(a==='confirm'){ draft=newDraft(pickVal); return go('profile'); }

  if(a==='avatar'){ return $('#avfile').click(); }
  if(a==='fillsample'){
    syncProfile();
    draft.nick='야생후추';
    draft.bio='제철 재료로 만드는 한 접시\n성수 · 예약제 운영';
    draft.theme='ink';
    draft.links=[
      {id:'i',title:'인스타그램 @wildpepper',url:'https://instagram.com/wildpepper'},
      {id:'y',title:'유튜브 — 오늘의 메뉴 기록',url:'https://youtube.com/@wildpepper'},
      {id:'b',title:'네이버 블로그 — 재료 이야기',url:'https://blog.naver.com/wildpepper'},
      {id:'s',title:'스마트스토어 — 소스·드레싱 판매',url:'https://smartstore.naver.com/wildpepper'},
      {id:'k',title:'카카오 오픈채팅 — 예약·문의',url:'https://open.kakao.com/o/wildpepper'}
    ];
    toast('예시로 채웠어요');
    return render();
  }
  if(a==='addlink'){ syncProfile(); return linkSheet(null); }
  if(a==='lmore'){ syncProfile(); return linkSheet(Number(v)); }
  if(a==='toTheme'){ syncProfile(); return go('theme'); }

  if(a==='theme'){ draft.theme=v; return render(); }
  if(a==='publish'){
    S.pages[draft.num]=draft; S.me=draft.num;
    save();
    stack=[]; return go('done',null,false);
  }

  if(a==='copy'){ copy(v); return toast('복사됐어요'); }
  if(a==='qrsave'){ return toast('QR을 저장했어요'); }
  if(a==='sharecard'){ return shareCard(); }

  if(a==='share'){ return shareSheet(); }
  if(a==='view'){ return go('preview'); }
  if(a==='edit'){ draft=me(); return go('profile'); }
  if(a==='theme2'){ draft=me(); return go('theme'); }
  if(a==='stats'){ return go('stats'); }
  if(a==='settings'){ return go('settings'); }
  if(a==='premium'){ return premiumSheet(); }
  if(a==='direct'){ var p=me(); p.direct=!p.direct; save(); return render(); }
  if(a==='tab'){ statTab=Number(v); return render(); }

  if(a==='pub'){ var q=me(); q.private=!q.private; save(); return render(); }
  if(a==='change'){ pickVal=''; return go('pick'); }
  if(a==='nodel'){ return delSheet(); }
});

function syncProfile(){
  var n=$('#f-nick'),b=$('#f-bio');
  if(n) draft.nick=n.value;
  if(b) draft.bio=b.value;
}
document.addEventListener('input',function(e){
  if(!draft) return;
  if(e.target.id==='f-nick'){
    draft.nick=e.target.value;
    var btn=document.querySelector('[data-a="toTheme"]');
    if(btn) btn.disabled=!e.target.value.trim();
  }
  if(e.target.id==='f-bio') draft.bio=e.target.value;
});
document.addEventListener('change',function(e){
  if(e.target.id==='impfile'&&e.target.files[0]) return importDemo(e.target.files[0]);
  if(e.target.id==='avfile'&&e.target.files[0]){
    var r=new FileReader();
    r.onload=function(){draft.avatar=r.result;render()};
    r.readAsDataURL(e.target.files[0]);
  }
});

/* ============================================================
   렌더
   ============================================================ */
var STEPS=[
  {k:'pick',n:'넘버 정하기'},
  {k:'profile',n:'프로필·링크'},
  {k:'theme',n:'테마'},
  {k:'done',n:'발행'},
  {k:'home',n:'관리·통계'}
];
function renderSteps(){
  var el=document.getElementById('steps'); if(!el) return;
  var idx=STEPS.map(function(s){return s.k}).indexOf(route);
  if(route==='stats'||route==='settings'||route==='preview') idx=4;
  el.innerHTML=STEPS.map(function(s,i){
    var cls=i===idx?'st on':(idx>=0&&i<idx?'st done':'st');
    return '<div class="'+cls+'"><i>'+(idx>=0&&i<idx?'✓':(i+1))+'</i>'+s.n+'</div>';
  }).join('');
}
function render(){
  var f=V[route]||V.intro;
  $('#view').innerHTML=f();
  renderSteps();
  if(route==='done'){
    var box=$('#qrbox'); var ok=false;
    if(box&&window.QRCode){
      box.innerHTML='<div id="qr"></div>';
      try{ new QRCode(document.getElementById('qr'),{text:'https://'+shortlink(me().num),width:116,height:116,correctLevel:QRCode.CorrectLevel.M}); ok=true; }catch(e){}
    }
    if(box&&!ok) box.innerHTML='<div style="width:136px;height:136px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink40);text-align:center;line-height:1.5">QR 코드<br>(인터넷 연결 시 표시)</div>';
  }
}
document.addEventListener('click',function(e){
  if(e.target.id==='wipe') wipeDemo();
  if(e.target.id==='exp') exportDemo();
  if(e.target.id==='imp') document.getElementById('impfile').click();

});
(function clock(){
  var d=new Date();
  $('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(clock,20000);
})();
render();
</script>
